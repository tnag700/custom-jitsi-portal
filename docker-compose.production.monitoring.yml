services:
  backend:
    environment:
      - APP_FEATURES_ADVANCED_MONITORING=true
      - APP_METRICS_PROMETHEUS_BASE_URL=http://prometheus:9090
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
    networks:
      - app_net
      - identity_net
      - data_net
      - ops_net

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    stop_grace_period: 10s
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-5}"
    command:
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.filesystem.mount-points-include=^/$
      - --path.procfs=/host/proc
      - --path.rootfs=/host/root
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
        bind:
          create_host_path: false
      # statfs only needs a directory on /, not access to the entire host.
      # Release preflight confirms this directory belongs to / and has no child mounts.
      - type: bind
        source: /etc/ssl/certs
        target: /host/root
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "9100"
    networks:
      - ops_net

  prometheus:
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-5}"
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    entrypoint:
      - /bin/sh
    command:
      - -ec
      - |
        escape_replacement() {
          printf '%s' "$1" | sed -e 's/[&|\\]/\\&/g'
        }
        monitoring_environment_escaped="$$(escape_replacement "${MONITORING_ENVIRONMENT:-prod}")"
        monitoring_service_escaped="$$(escape_replacement "${MONITORING_SERVICE_NAME:-jitsi-backend}")"
        grafana_base_url_escaped="$$(escape_replacement "${MONITORING_GRAFANA_BASE_URL:-http://grafana:3000}")"
        runbook_url_escaped="$$(escape_replacement "${MONITORING_RUNBOOK_URL:-docs/deployment-production.md#production-smoke-checklist}")"
        sed \
          -e "s|__MONITORING_ENVIRONMENT__|$$monitoring_environment_escaped|g" \
          -e "s|__MONITORING_SERVICE_NAME__|$$monitoring_service_escaped|g" \
          /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        sed \
          -e "s|__MONITORING_GRAFANA_BASE_URL__|$$grafana_base_url_escaped|g" \
          -e "s|__MONITORING_RUNBOOK_URL__|$$runbook_url_escaped|g" \
          /etc/prometheus/alert-rules.yml.template > /tmp/alert-rules.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d
    environment:
      - MONITORING_ENVIRONMENT=${MONITORING_ENVIRONMENT:-prod}
      - MONITORING_SERVICE_NAME=${MONITORING_SERVICE_NAME:-jitsi-backend}
      - MONITORING_GRAFANA_BASE_URL=${MONITORING_GRAFANA_BASE_URL:-http://grafana:3000}
      - MONITORING_RUNBOOK_URL=${MONITORING_RUNBOOK_URL:-docs/deployment-production.md#production-smoke-checklist}
    volumes:
      - ./pilot/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./pilot/monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml.template:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net
      - ops_net

  alertmanager:
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-5}"
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    entrypoint:
      - /bin/sh
    command:
      - -ec
      - |
        escape_replacement() {
          printf '%s' "$1" | sed -e 's/[&|\\]/\\&/g'
        }
        alertmanager_webhook_url_escaped="$$(escape_replacement "${ALERTMANAGER_WEBHOOK_URL:-http://mock-alert-receiver:9080/alerts}")"
        sed -e "s|__ALERTMANAGER_WEBHOOK_URL__|$$alertmanager_webhook_url_escaped|g" /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --log.level=info
    environment:
      - ALERTMANAGER_WEBHOOK_URL=${ALERTMANAGER_WEBHOOK_URL:-http://mock-alert-receiver:9080/alerts}
    volumes:
      - ./pilot/monitoring/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"
    depends_on:
      - mock-alert-receiver
    networks:
      - ops_net

  mock-alert-receiver:
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-5}"
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    working_dir: /app
    command:
      - node
      - /app/server.mjs
    environment:
      - ALERT_RECEIVER_PORT=9080
    volumes:
      - ./pilot/monitoring/mock-alert-receiver/server.mjs:/app/server.mjs:ro
    expose:
      - "9080"
    networks:
      - ops_net

  grafana:
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-5}"
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 256
    env_file:
      - ${GRAFANA_VAULT_ENV_FILE_PATH:?Set GRAFANA_VAULT_ENV_FILE_PATH to a private Vault-rendered env file}
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./pilot/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./pilot/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus
      - alertmanager
    networks:
      - ops_net

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
