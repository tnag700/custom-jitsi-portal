server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    refresh:
      atomic-store: ${APP_AUTH_REFRESH_ATOMIC_STORE:database}
      accept-issued-after: ${APP_AUTH_REFRESH_ACCEPT_ISSUED_AFTER}
  openapi:
    server-url: ${APP_OPENAPI_SERVER_URL:https://portal.example.com}
