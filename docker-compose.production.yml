name: jitsi-prod

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

x-service-runtime: &service-runtime
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *default-logging

x-one-shot-runtime: &one-shot-runtime
  restart: "no"
  stop_grace_period: 10s
  logging: *default-logging

services:
  nginx-cert-bootstrap:
    <<: *one-shot-runtime
    image: alpine:3.22.5@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    read_only: true
    network_mode: none
    entrypoint: ["sh", "-ec"]
    command:
      - |
        source_dir="/source/live/$${TLS_CERT_NAME}"
        test -s "$${source_dir}/fullchain.pem"
        test -s "$${source_dir}/privkey.pem"
        temp_dir=$$(mktemp -d /target/.refresh.XXXXXX)
        cp -L "$${source_dir}/fullchain.pem" "$${temp_dir}/fullchain.pem"
        cp -L "$${source_dir}/privkey.pem" "$${temp_dir}/privkey.pem"
        chmod 0444 "$${temp_dir}/fullchain.pem"
        chmod 0400 "$${temp_dir}/privkey.pem"
        chown 101:101 "$${temp_dir}/fullchain.pem" "$${temp_dir}/privkey.pem"
        mv -f "$${temp_dir}/fullchain.pem" /target/fullchain.pem
        mv -f "$${temp_dir}/privkey.pem" /target/privkey.pem
        rmdir "$${temp_dir}"
        test "$$(stat -c '%u:%g:%a' /target/fullchain.pem)" = "101:101:444"
        test "$$(stat -c '%u:%g:%a' /target/privkey.pem)" = "101:101:400"
    environment:
      - TLS_CERT_NAME=${TLS_CERT_NAME:?Set TLS_CERT_NAME}
    volumes:
      - ${NGINX_CERTS_PATH?Set NGINX_CERTS_PATH}:/source:ro
      - nginx-certs:/target

  nginx:
    <<: *service-runtime
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && nc -z -w 2 127.0.0.1 8080 && nc -z -w 2 127.0.0.1 8443"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0750
    depends_on:
      nginx-cert-bootstrap:
        condition: service_completed_successfully
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      jitsi-web:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      - NGINX_ENVSUBST_FILTER=^(PORTAL_HOST|AUTH_HOST|MEET_HOST)$$
      - PORTAL_HOST=${PORTAL_HOST:?Set PORTAL_HOST}
      - AUTH_HOST=${AUTH_HOST:?Set AUTH_HOST}
      - MEET_HOST=${MEET_HOST:?Set MEET_HOST}
    volumes:
      - ${NGINX_PORTAL_CONFIG_PATH:-./deploy/nginx/portal.conf.example}:/etc/nginx/templates/default.conf.template:ro
      - nginx-certs:/etc/nginx/certs:ro
    networks:
      edge_net: {}
      app_net: {}
      identity_net:
        ipv4_address: 172.28.240.10
      realtime_net: {}

  frontend:
    <<: *service-runtime
    build:
      context: ./frontend-qwik
      args:
        VITE_API_URL: ${APP_FRONTEND_ORIGIN:?Set APP_FRONTEND_ORIGIN}/api/v1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - API_URL=http://backend:8080/api/v1
      - PUBLIC_API_URL=${APP_FRONTEND_ORIGIN:?Set APP_FRONTEND_ORIGIN}/api/v1
      - AUTH_LOGOUT_ALLOWED_ORIGINS=${KC_HOSTNAME:?Set KC_HOSTNAME}
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  backend:
    <<: *service-runtime
    build:
      context: ./backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cpus: 2.0
    mem_limit: 1024m
    pids_limit: 512
    entrypoint: ["sh", "/vault/auth/backend/run-with-rendered-secrets.sh.example"]
    command: ["java", "-jar", "/app/app.jar"]
    expose:
      - "8080"
    environment:
      - BACKEND_SECRETS_FILE=/vault/runtime/backend/runtime.env
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT:-6379}
      - APP_FEATURES_CONFIG_SETS_FROM_DB=true
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/jitsi}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-jitsi}
      - APP_OPENAPI_SERVER_URL=${APP_OPENAPI_SERVER_URL:?Set APP_OPENAPI_SERVER_URL}
      - APP_MEETINGS_TOKEN_ISSUER=${APP_MEETINGS_TOKEN_ISSUER:?Set APP_MEETINGS_TOKEN_ISSUER}
      - APP_MEETINGS_TOKEN_JOIN_URL_TEMPLATE=${APP_MEETINGS_TOKEN_JOIN_URL_TEMPLATE:?Set APP_MEETINGS_TOKEN_JOIN_URL_TEMPLATE}
      - APP_MEETINGS_SERVICE_URL=${APP_MEETINGS_SERVICE_URL:?Set APP_MEETINGS_SERVICE_URL}
      - APP_MEETINGS_TOKEN_AUDIENCE=${APP_MEETINGS_TOKEN_AUDIENCE:-jitsi-meet}
      - APP_MEETINGS_TOKEN_ROLE_CLAIM_NAME=${APP_MEETINGS_TOKEN_ROLE_CLAIM_NAME:-role}
      - APP_MEETINGS_TOKEN_ALGORITHM=${APP_MEETINGS_TOKEN_ALGORITHM:?set APP_MEETINGS_TOKEN_ALGORITHM}
      - APP_AUTH_REFRESH_IDLE_TTL_MINUTES=${APP_AUTH_REFRESH_IDLE_TTL_MINUTES:-60}
      - APP_AUTH_REFRESH_ATOMIC_STORE=${APP_AUTH_REFRESH_ATOMIC_STORE:-database}
      - APP_AUTH_REFRESH_ACCEPT_ISSUED_AFTER=${APP_AUTH_REFRESH_ACCEPT_ISSUED_AFTER:?Set durable refresh store cutover instant}
      - APP_SECURITY_JWT_ISSUER=${APP_SECURITY_JWT_ISSUER:?Set APP_SECURITY_JWT_ISSUER}
      - APP_SECURITY_JWT_AUDIENCE=${APP_SECURITY_JWT_AUDIENCE:-jitsi-meet}
      - APP_SECURITY_JWT_ROLE_CLAIM=${APP_SECURITY_JWT_ROLE_CLAIM:-role}
      - APP_SECURITY_JWT_ALGORITHM=${APP_SECURITY_JWT_ALGORITHM:?set APP_SECURITY_JWT_ALGORITHM}
      - APP_SECURITY_JWT_ACCESS_TTL_MINUTES=${APP_SECURITY_JWT_ACCESS_TTL_MINUTES:-20}
      - APP_SECURITY_JWT_REFRESH_TTL_MINUTES=${APP_SECURITY_JWT_REFRESH_TTL_MINUTES:-60}
      - SSO_AUTHORIZATION_URI=${SSO_AUTHORIZATION_URI:?Set SSO_AUTHORIZATION_URI}
      - SSO_TOKEN_URI=${SSO_TOKEN_URI:?Set SSO_TOKEN_URI}
      - SSO_JWK_SET_URI=${SSO_JWK_SET_URI:?Set SSO_JWK_SET_URI}
      - SSO_USER_INFO_URI=${SSO_USER_INFO_URI:?Set SSO_USER_INFO_URI}
      - APP_SECURITY_SSO_EXPECTED_ISSUER=${APP_SECURITY_SSO_EXPECTED_ISSUER:?Set APP_SECURITY_SSO_EXPECTED_ISSUER}
      - APP_FRONTEND_ORIGIN=${APP_FRONTEND_ORIGIN:?Set APP_FRONTEND_ORIGIN}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-jitsi-backend}
      - JAVA_TOOL_OPTIONS=-Dhttps.proxyHost=osv-egress-proxy -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=localhost|127.*|[::1]|*.jitsi|keycloak|db|redis|vault
    volumes:
      - ./deploy/vault/auth/backend/run-with-rendered-secrets.sh.example:/vault/auth/backend/run-with-rendered-secrets.sh.example:ro
      - backend-vault-runtime:/vault/runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      backend-vault-bootstrap:
        condition: service_completed_successfully
      osv-egress-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net
      - identity_net
      - data_net

  osv-egress-proxy:
    <<: *service-runtime
    image: node:24.18.0-alpine
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777,noexec
    cpus: 0.25
    mem_limit: 96m
    pids_limit: 64
    command: ["node", "/app/osv-proxy.mjs"]
    environment:
      - OSV_TARGET_HOST=api.osv.dev
      - OSV_TARGET_PORT=443
      - PROXY_PORT=3128
    volumes:
      - ./deploy/egress/osv-proxy.mjs:/app/osv-proxy.mjs:ro
    expose:
      - "3128"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(3128,'127.0.0.1');const t=setTimeout(()=>process.exit(1),2000);s.on('connect',()=>{clearTimeout(t);s.end()});s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app_net
      - osv_egress_net

  backend-vault-bootstrap:
    <<: *one-shot-runtime
    image: jitsi-vault:1.21.4
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["sh"]
    command: ["/vault/auth/backend/startup-fetch.sh.example"]
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_CACERT=/vault/tls/ca.crt
      - VAULT_API_ADDR=https://vault:8200
      - VAULT_CLUSTER_ADDR=https://vault:8201
      - ROLE_ID_FILE=/vault/local/backend/role_id
      - WRAPPED_SECRET_ID_FILE=/vault/local/backend/wrapped-secret-id
      - TOKEN_SINK_FILE=/vault/runtime/backend-batch-token
      - BACKEND_ENV_OUTPUT_FILE=/vault/runtime/backend/runtime.env
      - BACKEND_APP_SECRET_PATH=kv/app/backend/runtime
      - BACKEND_OIDC_SECRET_PATH=kv/identity/backend/oidc
      - BACKEND_REDIS_SECRET_PATH=kv/app/redis/runtime
      - BACKEND_DB_STATIC_CREDENTIAL_PATH=database/static-creds/backend-app
      - BACKEND_DB_DYNAMIC_CREDENTIAL_PATH=database/creds/backend-app
      - OUTPUT_UID=10001
      - OUTPUT_GID=10001
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./deploy/vault/auth/backend/startup-fetch.sh.example:/vault/auth/backend/startup-fetch.sh.example:ro
      - ${BACKEND_VAULT_ROLE_ID_PATH?Set BACKEND_VAULT_ROLE_ID_PATH}:/vault/local/backend/role_id:ro
      - ${BACKEND_VAULT_WRAPPED_SECRET_ID_PATH?Set BACKEND_VAULT_WRAPPED_SECRET_ID_PATH}:/vault/local/backend/wrapped-secret-id:ro
      - ${VAULT_TLS_DIR:?Set VAULT_TLS_DIR to the private Vault TLS directory}:/vault/tls:ro
      - backend-vault-runtime:/vault/runtime
    networks:
      - secret_net

  db:
    <<: *service-runtime
    stop_grace_period: 60s
    image: postgres:18.4
    cap_drop:
      - ALL
    # The official entrypoint starts as root so it can prepare a fresh data
    # volume, then drops privileges to the postgres user. Keep only the
    # capabilities required for that one-time ownership/uid transition.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${POSTGRES_VAULT_ENV_FILE_PATH:?Set POSTGRES_VAULT_ENV_FILE_PATH to a private Vault-rendered env file}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-jitsi}
      - POSTGRES_USER=${POSTGRES_USER:-jitsi}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jitsi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_net

  redis:
    <<: *service-runtime
    image: redis:8.4.5@sha256:efe6e2625e4601cd7119c4fb48b1c04cf3071f8b1729ede1216ceee8bc99742d
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data
      - /tmp
    env_file:
      - ${REDIS_VAULT_ENV_FILE_PATH:?Set REDIS_VAULT_ENV_FILE_PATH to a private Vault-rendered env file}
    command: ["sh", "-ec", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_net

  vault:
    <<: *service-runtime
    stop_grace_period: 60s
    build:
      context: ./deploy/vault
      args:
        VAULT_VERSION: 1.21.4
        VAULT_ZIP_URL: https://mirror.yandex.ru/mirrors/releases.hashicorp.com/vault/1.21.4/vault_1.21.4_linux_amd64.zip
        VAULT_SHA256SUMS_URL: https://mirror.yandex.ru/mirrors/releases.hashicorp.com/vault/1.21.4/vault_1.21.4_SHA256SUMS
    image: jitsi-vault:1.21.4
    cap_drop:
      - ALL
    cap_add:
      # Required to traverse the operator-owned 0700 runtime TLS bind mount
      # without weakening the Vault server-key permissions on the host.
      # The CA signing key lives in separate offline custody and is never mounted.
      - DAC_OVERRIDE
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    command: ["server", "-config=/vault/config/vault.hcl"]
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_CACERT=/vault/tls/ca.crt
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    expose:
      - "8200"
      - "8201"
    volumes:
      - ./deploy/vault/config/vault.hcl.example:/vault/config/vault.hcl:ro
      - ./deploy/vault/bootstrap:/vault/bootstrap:ro
      - ${VAULT_TLS_DIR:?Set VAULT_TLS_DIR to the private Vault TLS directory}:/vault/tls:ro
      - vault-data:/vault/data
      - vault-audit:/vault/audit
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - secret_net
      - ops_net

  keycloak-db:
    <<: *service-runtime
    stop_grace_period: 60s
    image: postgres:18.4
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${KEYCLOAK_POSTGRES_VAULT_ENV_FILE_PATH:?Set KEYCLOAK_POSTGRES_VAULT_ENV_FILE_PATH to a private Vault-rendered env file}
    environment:
      - POSTGRES_DB=${KEYCLOAK_POSTGRES_DB:-keycloak}
      - POSTGRES_USER=${KEYCLOAK_POSTGRES_USER:-keycloak}
    expose:
      - "5432"
    volumes:
      - keycloak-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_POSTGRES_USER:-keycloak} -d ${KEYCLOAK_POSTGRES_DB:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - identity_data_net

  keycloak-realm-bootstrap:
    <<: *one-shot-runtime
    image: alpine:3.22.5@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777,noexec
    network_mode: none
    entrypoint: ["sh", "-ec"]
    command:
      - |
        test -s /source/jitsi-realm.json
        cp /source/jitsi-realm.json /target/.jitsi-realm.json.tmp
        chmod 0400 /target/.jitsi-realm.json.tmp
        chown 1000:0 /target/.jitsi-realm.json.tmp
        mv -f /target/.jitsi-realm.json.tmp /target/jitsi-realm.json
    volumes:
      - ${KEYCLOAK_REALM_IMPORT_DIR:?Set KEYCLOAK_REALM_IMPORT_DIR to the private production realm directory}:/source:ro
      - keycloak-realm-import:/target

  keycloak:
    <<: *service-runtime
    stop_grace_period: 60s
    build:
      context: ./deploy/keycloak
    image: jitsi-keycloak:26.7.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777,noexec
      - /opt/keycloak/data/tmp:size=64M,uid=1000,gid=0,mode=0770,noexec
      - /opt/keycloak/data/transaction-logs:size=64M,uid=1000,gid=0,mode=0770,noexec
    cpus: 1.5
    mem_limit: 1024m
    pids_limit: 384
    command: ["start", "--optimized", "--import-realm"]
    env_file:
      - ${KEYCLOAK_VAULT_ENV_FILE_PATH:?Set KEYCLOAK_VAULT_ENV_FILE_PATH to a private Vault-rendered env file}
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_POSTGRES_DB:-keycloak}
      - KC_DB_USERNAME=${KEYCLOAK_POSTGRES_USER:-keycloak}
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_HTTP_ENABLED=true
      - OIDC_REDIRECT_BASE_URI=${APP_FRONTEND_ORIGIN:?Set APP_FRONTEND_ORIGIN}
      - APP_FRONTEND_ORIGIN=${APP_FRONTEND_ORIGIN:?Set APP_FRONTEND_ORIGIN}
      - KC_HOSTNAME=${KC_HOSTNAME:?Set KC_HOSTNAME}
      - KC_HOSTNAME_STRICT=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_PROXY_TRUSTED_ADDRESSES=${KC_PROXY_TRUSTED_ADDRESSES:-172.28.240.10}
    volumes:
      - keycloak-realm-import:/opt/keycloak/data/import:ro
    expose:
      - "8080"
      - "9000"
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak-realm-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - identity_net
      - identity_data_net

  jitsi-web:
    <<: *service-runtime
    image: ghcr.io/jitsi/web:stable-11146-1@sha256:ff81559621732d3dfc4815f261d41fd826566833016ea772f4d43a77aa88fe9a
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:size=16M,uid=1000,gid=1000,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    env_file:
      - ${JITSI_WEB_VAULT_ENV_FILE_PATH:?Set JITSI_WEB_VAULT_ENV_FILE_PATH to a private Vault-rendered env file}
    environment:
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - PROSODY_AUTH_TYPE=jwt
      - JWT_APP_ID=${APP_MEETINGS_TOKEN_ISSUER:?Set APP_MEETINGS_TOKEN_ISSUER}
      - JWT_ACCEPTED_ISSUERS=${APP_MEETINGS_TOKEN_ISSUER:?Set APP_MEETINGS_TOKEN_ISSUER}
      - JWT_ACCEPTED_AUDIENCES=${JWT_ACCEPTED_AUDIENCES:-jitsi-meet}
      - JWT_ALLOW_EMPTY=0
      - ENABLE_GUESTS=0
      - DISABLE_HTTPS=1
      - ENABLE_HTTP_REDIRECT=0
      - ENABLE_LETSENCRYPT=0
      - ENABLE_XMPP_WEBSOCKET=1
      - PUBLIC_URL=${PUBLIC_URL:?Set PUBLIC_URL}
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - JVB_BREWERY_MUC=jvbbrewery
      - JICOFO_AUTH_USER=focus
      - JVB_AUTH_USER=jvb
      - TZ=UTC
    expose:
      - "8000"
      - "8443"
    volumes:
      - jitsi-web-config:/config
      - jitsi-web-storage:/storage
      - ./pilot/jitsi/web/custom-config.js:/config/custom-config.js:ro
      - ./pilot/jitsi/web/close.js:/usr/share/jitsi-meet/static/close.js:ro
    configs:
      - source: jitsi-web-portal-access
        target: /config/nginx/custom-meet.conf
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/config.js"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realtime_net

  jitsi-prosody:
    <<: *service-runtime
    image: ghcr.io/jitsi/prosody:stable-11146-1@sha256:0e3d9ada40c03e6eef151348e0872dce7b4b1c16c173ff4a67afeae60aba2404
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:size=16M,uid=1000,gid=1000,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    env_file:
      - ${JITSI_PROSODY_VAULT_ENV_FILE_PATH:?Set JITSI_PROSODY_VAULT_ENV_FILE_PATH to a private Vault-rendered env file}
    environment:
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - PROSODY_AUTH_TYPE=jwt
      - JWT_APP_ID=${APP_MEETINGS_TOKEN_ISSUER:?Set APP_MEETINGS_TOKEN_ISSUER}
      - JWT_ACCEPTED_ISSUERS=${APP_MEETINGS_TOKEN_ISSUER:?Set APP_MEETINGS_TOKEN_ISSUER}
      - JWT_ACCEPTED_AUDIENCES=${JWT_ACCEPTED_AUDIENCES:-jitsi-meet}
      - JWT_ALLOW_EMPTY=0
      - ENABLE_GUESTS=0
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - JICOFO_AUTH_USER=focus
      - JVB_AUTH_USER=jvb
      - TZ=UTC
    volumes:
      - jitsi-prosody-config:/config
      - jitsi-prosody-plugins:/prosody-plugins-custom
      - jitsi-prosody-storage:/var/lib/prosody
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5280/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      realtime_net:
        aliases:
          - meet.jitsi
          - auth.meet.jitsi
          - xmpp.meet.jitsi
          - muc.meet.jitsi
          - internal-muc.meet.jitsi
          - guest.meet.jitsi

  jitsi-jicofo:
    <<: *service-runtime
    stop_grace_period: 60s
    image: ghcr.io/jitsi/jicofo:stable-11146-1@sha256:a5da296923010dcc2daf6a02e6a183181906cb969a088ae90b97516bdeb9737f
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:size=16M,uid=1000,gid=1000,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 256
    env_file:
      - ${JITSI_JICOFO_VAULT_ENV_FILE_PATH:?Set JITSI_JICOFO_VAULT_ENV_FILE_PATH to a private Vault-rendered env file}
    environment:
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - PROSODY_AUTH_TYPE=jwt
      - JICOFO_ENABLE_REST=1
      - JICOFO_AUTH_USER=focus
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - TZ=UTC
    volumes:
      - jitsi-jicofo-config:/config
    depends_on:
      - jitsi-prosody
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8888'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realtime_net

  jitsi-jvb:
    <<: *service-runtime
    stop_grace_period: 90s
    image: ghcr.io/jitsi/jvb:stable-11146-1@sha256:6a7cec66c6a2fdd8ffd3a90101a0f8e3297aff29494f258caf1bcfbd418a17f3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:size=16M,uid=1000,gid=1000,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    cpus: 1.5
    mem_limit: 768m
    pids_limit: 256
    env_file:
      - ${JITSI_JVB_VAULT_ENV_FILE_PATH:?Set JITSI_JVB_VAULT_ENV_FILE_PATH to a private Vault-rendered env file}
    environment:
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - PROSODY_AUTH_TYPE=jwt
      - JVB_AUTH_USER=jvb
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=10000
      - JVB_ADVERTISE_IPS=${JVB_ADVERTISE_IPS:?set JVB_ADVERTISE_IPS to the LAN and public NAT addresses}
      - TZ=UTC
    volumes:
      - jitsi-jvb-config:/config
    depends_on:
      - jitsi-prosody
    ports:
      - "10000:10000/udp"
    healthcheck:
      test: ["CMD", "bash", "-lc", "ss -lun | grep -q 10000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realtime_net

configs:
  jitsi-web-portal-access:
    file: ./pilot/jitsi/web/custom-meet.production.conf

volumes:
