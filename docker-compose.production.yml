services:
  nginx:
    image: nginx:1.27-alpine
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      jitsi-web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_PORTAL_CONFIG_PATH:-./deploy/nginx/portal.conf.example}:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_CERTS_PATH?Set NGINX_CERTS_PATH}:/etc/letsencrypt:ro
    networks:
      edge_net: {}
      app_net: {}
      identity_net:
        ipv4_address: 172.28.240.10
      realtime_net: {}

  frontend:
    build:
      context: ./frontend-qwik
      args:
        VITE_API_URL: ${APP_FRONTEND_ORIGIN:-https://portal.example.com}/api/v1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - API_URL=http://backend:8080/api/v1
      - PUBLIC_API_URL=${APP_FRONTEND_ORIGIN:-https://portal.example.com}/api/v1
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  backend:
    build:
      context: ./backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cpus: 2.0
    mem_limit: 1024m
    pids_limit: 512
    entrypoint: ["sh", "/vault/auth/backend/run-with-rendered-secrets.sh.example"]
    command: ["java", "-jar", "/app/app.jar"]
    expose:
      - "8080"
    environment:
      - BACKEND_SECRETS_FILE=/vault/runtime/backend/runtime.env
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT:-6379}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/jitsi}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-jitsi}
      - APP_OPENAPI_SERVER_URL=${APP_OPENAPI_SERVER_URL:-https://portal.example.com}
      - APP_MEETINGS_TOKEN_ISSUER=${APP_MEETINGS_TOKEN_ISSUER:-https://portal.example.com}
      - APP_MEETINGS_TOKEN_JOIN_URL_TEMPLATE=${APP_MEETINGS_TOKEN_JOIN_URL_TEMPLATE:-https://meet.example.com/%s#jwt=%s}
      - APP_MEETINGS_TOKEN_AUDIENCE=${APP_MEETINGS_TOKEN_AUDIENCE:-jitsi-meet}
      - APP_MEETINGS_TOKEN_ROLE_CLAIM_NAME=${APP_MEETINGS_TOKEN_ROLE_CLAIM_NAME:-role}
      - APP_MEETINGS_TOKEN_ALGORITHM=${APP_MEETINGS_TOKEN_ALGORITHM:?set APP_MEETINGS_TOKEN_ALGORITHM}
      - APP_AUTH_REFRESH_IDLE_TTL_MINUTES=${APP_AUTH_REFRESH_IDLE_TTL_MINUTES:-60}
      - APP_SECURITY_JWT_ISSUER=${APP_SECURITY_JWT_ISSUER:-https://portal.example.com}
      - APP_SECURITY_JWT_AUDIENCE=${APP_SECURITY_JWT_AUDIENCE:-jitsi-meet}
      - APP_SECURITY_JWT_ROLE_CLAIM=${APP_SECURITY_JWT_ROLE_CLAIM:-role}
      - APP_SECURITY_JWT_ALGORITHM=${APP_SECURITY_JWT_ALGORITHM:?set APP_SECURITY_JWT_ALGORITHM}
      - APP_SECURITY_JWT_ACCESS_TTL_MINUTES=${APP_SECURITY_JWT_ACCESS_TTL_MINUTES:-20}
      - APP_SECURITY_JWT_REFRESH_TTL_MINUTES=${APP_SECURITY_JWT_REFRESH_TTL_MINUTES:-60}
      - SSO_AUTHORIZATION_URI=${SSO_AUTHORIZATION_URI:-https://auth.example.com/realms/jitsi/protocol/openid-connect/auth}
      - SSO_TOKEN_URI=${SSO_TOKEN_URI:-https://auth.example.com/realms/jitsi/protocol/openid-connect/token}
      - SSO_JWK_SET_URI=${SSO_JWK_SET_URI:-https://auth.example.com/realms/jitsi/protocol/openid-connect/certs}
      - SSO_USER_INFO_URI=${SSO_USER_INFO_URI:-https://auth.example.com/realms/jitsi/protocol/openid-connect/userinfo}
      - APP_SECURITY_SSO_EXPECTED_ISSUER=${APP_SECURITY_SSO_EXPECTED_ISSUER:-https://auth.example.com/realms/jitsi}
      - APP_FRONTEND_ORIGIN=${APP_FRONTEND_ORIGIN:-https://portal.example.com}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-jitsi-backend}
    volumes:
      - ./deploy/vault/auth/backend/run-with-rendered-secrets.sh.example:/vault/auth/backend/run-with-rendered-secrets.sh.example:ro
      - backend-vault-runtime:/vault/runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      backend-vault-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net
      - identity_net
      - data_net

  backend-vault-bootstrap:
    image: jitsi-vault:1.21.4
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    command: ["sh", "/vault/auth/backend/startup-fetch.sh.example"]
    environment:
      - VAULT_ADDR=http://vault:8200
      - ROLE_ID_FILE=/vault/local/backend/role_id
      - WRAPPED_SECRET_ID_FILE=/vault/local/backend/wrapped-secret-id
      - TOKEN_SINK_FILE=/vault/runtime/backend-batch-token
      - BACKEND_ENV_OUTPUT_FILE=/vault/runtime/backend/runtime.env
      - BACKEND_APP_SECRET_PATH=kv/app/backend/runtime
      - BACKEND_OIDC_SECRET_PATH=kv/identity/backend/oidc
      - BACKEND_REDIS_SECRET_PATH=kv/app/redis/runtime
      - BACKEND_DB_STATIC_CREDENTIAL_PATH=database/static-creds/backend-app
      - BACKEND_DB_DYNAMIC_CREDENTIAL_PATH=database/creds/backend-app
      - OUTPUT_UID=10001
      - OUTPUT_GID=10001
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./deploy/vault/auth/backend/startup-fetch.sh.example:/vault/auth/backend/startup-fetch.sh.example:ro
      - ${BACKEND_VAULT_ROLE_ID_PATH?Set BACKEND_VAULT_ROLE_ID_PATH}:/vault/local/backend/role_id:ro
      - ${BACKEND_VAULT_WRAPPED_SECRET_ID_PATH?Set BACKEND_VAULT_WRAPPED_SECRET_ID_PATH}:/vault/local/backend/wrapped-secret-id:ro
      - backend-vault-runtime:/vault/runtime
    networks:
      - secret_net

  db:
    image: postgres:18.1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${POSTGRES_VAULT_ENV_FILE_PATH:-./deploy/vault/delivery/examples/postgres.env.example}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-jitsi}
      - POSTGRES_USER=${POSTGRES_USER:-jitsi}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jitsi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_net

  redis:
    image: redis:8.4
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data
      - /tmp
    env_file:
      - ${REDIS_VAULT_ENV_FILE_PATH:-./deploy/vault/delivery/examples/redis.env.example}
    command: ["sh", "-ec", "exec redis-server --save '' --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data_net

  vault:
    build:
      context: ./deploy/vault
      args:
        VAULT_VERSION: 1.21.4
        VAULT_ZIP_URL: https://mirror.yandex.ru/mirrors/releases.hashicorp.com/vault/1.21.4/vault_1.21.4_linux_amd64.zip
        VAULT_SHA256SUMS_URL: https://mirror.yandex.ru/mirrors/releases.hashicorp.com/vault/1.21.4/vault_1.21.4_SHA256SUMS
    image: jitsi-vault:1.21.4
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    command: ["server", "-config=/vault/config/vault.hcl"]
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    expose:
      - "8200"
      - "8201"
    volumes:
      - ./deploy/vault/config/vault.hcl.example:/vault/config/vault.hcl:ro
      - ./deploy/vault/bootstrap:/vault/bootstrap:ro
      - vault-data:/vault/data
      - vault-audit:/vault/audit
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1; status=$$?; if [ \"$$status\" = \"0\" ] || [ \"$$status\" = \"2\" ]; then exit 0; fi; exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - secret_net
      - ops_net

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cpus: 1.5
    mem_limit: 1024m
    pids_limit: 384
    command: ["start", "--http-enabled=true", "--import-realm"]
    env_file:
      - ${KEYCLOAK_VAULT_ENV_FILE_PATH:-./deploy/vault/delivery/examples/keycloak.env.example}
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN?Set KEYCLOAK_ADMIN}
      - KC_HOSTNAME=${KC_HOSTNAME:-https://auth.example.com}
      - KC_HOSTNAME_STRICT=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_PROXY_TRUSTED_ADDRESSES=${KC_PROXY_TRUSTED_ADDRESSES:-172.28.240.10}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./pilot/keycloak/realm:/opt/keycloak/data/import:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - identity_net

  jitsi-web:
    image: jitsi/web:stable-10741
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    env_file:
      - ${JITSI_WEB_VAULT_ENV_FILE_PATH:-./deploy/vault/delivery/examples/jitsi-web.env.example}
    environment:
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - PROSODY_AUTH_TYPE=jwt
      - JWT_APP_ID=${JWT_APP_ID:-https://portal.example.com}
      - JWT_ACCEPTED_ISSUERS=${JWT_ACCEPTED_ISSUERS:-https://portal.example.com}
      - JWT_ACCEPTED_AUDIENCES=${JWT_ACCEPTED_AUDIENCES:-jitsi-meet}
      - JWT_ALLOW_EMPTY=0
      - ENABLE_GUESTS=0
      - ENABLE_LETSENCRYPT=0
      - PUBLIC_URL=${PUBLIC_URL:-https://meet.example.com}
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - JVB_BREWERY_MUC=jvbbrewery
      - JICOFO_AUTH_USER=focus
      - JVB_AUTH_USER=jvb
      - TZ=UTC
    expose:
      - "80"
    volumes:
      - jitsi-web-config:/config
      - ./pilot/jitsi/web/custom-config.js:/config/custom-config.js:ro
      - ./pilot/jitsi/web/close.js:/usr/share/jitsi-meet/static/close.js:ro
      - ./pilot/jitsi/config/web/keys:/config/keys:ro
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realtime_net

  jitsi-prosody:
    image: jitsi/prosody:stable-10741
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    env_file:
      - ${JITSI_PROSODY_VAULT_ENV_FILE_PATH:-./deploy/vault/delivery/examples/jitsi-prosody.env.example}
    environment:
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - PROSODY_AUTH_TYPE=jwt
      - JWT_APP_ID=${JWT_APP_ID:-https://portal.example.com}
      - JWT_ACCEPTED_ISSUERS=${JWT_ACCEPTED_ISSUERS:-https://portal.example.com}
      - JWT_ACCEPTED_AUDIENCES=${JWT_ACCEPTED_AUDIENCES:-jitsi-meet}
      - JWT_ALLOW_EMPTY=0
      - ENABLE_GUESTS=0
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - JICOFO_AUTH_USER=focus
      - JVB_AUTH_USER=jvb
      - TZ=UTC
    volumes:
      - jitsi-prosody-config:/config
    healthcheck:
      test: ["CMD", "prosodyctl", "--config", "/config/prosody.cfg.lua", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      realtime_net:
        aliases:
          - meet.jitsi
          - auth.meet.jitsi
          - xmpp.meet.jitsi
          - muc.meet.jitsi
          - internal-muc.meet.jitsi
          - guest.meet.jitsi

  jitsi-jicofo:
    image: jitsi/jicofo:stable-10741
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 256
    env_file:
      - ${JITSI_JICOFO_VAULT_ENV_FILE_PATH:-./deploy/vault/delivery/examples/jitsi-jicofo.env.example}
    environment:
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - PROSODY_AUTH_TYPE=jwt
      - JICOFO_AUTH_USER=focus
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - TZ=UTC
    volumes:
      - jitsi-jicofo-config:/config
    depends_on:
      - jitsi-prosody
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8888'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realtime_net

  jitsi-jvb:
    image: jitsi/jvb:stable-10741
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cpus: 1.5
    mem_limit: 768m
    pids_limit: 256
    env_file:
      - ${JITSI_JVB_VAULT_ENV_FILE_PATH:-./deploy/vault/delivery/examples/jitsi-jvb.env.example}
    environment:
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - PROSODY_AUTH_TYPE=jwt
      - JVB_AUTH_USER=jvb
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=10000
      - TZ=UTC
    volumes:
      - jitsi-jvb-config:/config
    depends_on:
      - jitsi-prosody
    ports:
      - "10000:10000/udp"
    healthcheck:
      test: ["CMD", "bash", "-lc", "ss -lun | grep -q 10000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realtime_net

volumes:
  pgdata:
  keycloak-data:
  jitsi-web-config:
  jitsi-prosody-config:
  jitsi-jicofo-config:
  jitsi-jvb-config:
  backend-vault-runtime:
  vault-data:
  vault-audit:


networks:
  edge_net:
  app_net:
    internal: true
  identity_net:
    internal: true
    ipam:
      config:
        - subnet: 172.28.240.0/24
  realtime_net:
  data_net:
    internal: true
  secret_net:
    internal: true
  ops_net:
    internal: true
